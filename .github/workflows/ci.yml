name: ci

# **workbench は npm の依存を持たない。だからこの job は何も install しない** —— 在るのは node の
# http サーバ 1 本と、ブラウザで素のまま走る JS だけ (capture-scripts と同じ判断)。
# 例外の public/vendor/ の束 2 つ (読む所の色付けの shiki.js と、画面の文言を文にする
# intl-messageformat.js) は commit してあるので、試験はそれをそのまま読む。依存が在るのは docs-site/ と highlighter/ (束を作る元) で、監査は audit.yml、
# docs の検査は site.yml、公開は docs.yml、束の作り直しは vendor.yml が持つ。
#
# 走らせるのは `npm run check` (中身は package.json の `check`)。**中継と、本物の IdP との往復は
# ここでは見ない** —— あれは capture-ledger と IdP が立っていないと確かめられないので、
# 証拠は手で当てて PR に貼る。名乗りの部品 (src/auth.mjs) は、偽の IdP を渡す試験 (test/auth.test.mjs) が見る。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check
        run: npm run check
