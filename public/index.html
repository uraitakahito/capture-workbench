<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Capture — workbench</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>Web Capture</h1>
      <nav id="tabs">
        <button type="button" id="tab-crawls" class="on" data-face="crawls" data-i18n="common.tab.crawls"></button>
        <button type="button" id="tab-start" data-face="start" data-i18n="common.tab.start"></button>
        <button type="button" id="tab-schedules" data-face="schedules"><span data-i18n="common.tab.schedules"></span><span id="tab-schedules-count" class="tab-count" hidden></span></button>
        <button type="button" id="tab-changes" data-face="changes" data-i18n="common.tab.changes"></button>
        <button type="button" id="tab-archives" data-face="archives" data-i18n="common.tab.archives"></button>
        <button type="button" id="tab-search" data-face="search" data-i18n="common.tab.search"></button>
        <button type="button" id="tab-scripts" data-face="scripts" data-i18n="common.tab.scripts"></button>
        <button type="button" id="tab-wacz" data-face="wacz" hidden>WACZ</button>
      </nav>
      <p class="who"><span id="who" data-i18n="common.who.checking"></span> <a href="/logout" data-i18n="common.who.signOut"></a>
        <!-- 言語の切り替え。押すと選びを覚えて頁を読み直す（i18n.js の switchLang）。いまの言語の側は押せない -->
        <span id="lang" class="lang" role="group" data-i18n-aria-label="common.lang.label"
          ><button type="button" data-lang="ja" lang="ja" data-i18n="common.lang.ja"></button> /
          <button type="button" data-lang="en" lang="en" data-i18n="common.lang.en"></button
        ></span>
      </p>
    </header>

    <!--
      失敗は消さずに残す。**画面が空なのと、取りに行けないのは別。**
      capture-ledger が落ちていれば、そう言ったまま最後の表を残す。
    -->
    <p id="trouble" class="trouble" hidden></p>
    <!--
      定期実行の帯。#trouble は引き直しが成功すると消えるので、同じ所に書かない。全部のタブで見え、手で閉じない ——
      原因が直ると消える。読み取りは一覧の引き直しと別の輪（app.js の refreshSchedules）。
    -->
    <p id="schedule-band" class="schedule-band" hidden><span id="schedule-band-text"></span> <a href="#schedules" data-i18n="common.band.open"></a></p>

    <main>
      <!--
        クロールの画面。一覧（#crawls）と、クロール 1 本のリンクの構成（#links/<クロールの id>[/<ページの id>]・
        CAPTURE-246）と、取り込み 1 回の経緯（#trace/<クロールの id>/<ページの id>・CAPTURE-270）。リンクの構成は
        一覧の「リンク」の数から、経緯はページの表の「経緯」から開き、一覧と入れ替える（タブは「クロール」のまま）。
      -->
      <section id="face-crawls">
       <div id="crawls-list">
        <table>
          <thead>
            <tr>
              <th data-i18n="crawls.col.state"></th>
              <th>id</th>
              <th data-i18n="crawls.col.by"></th>
              <th data-i18n="crawls.col.seed"></th>
              <th class="num" data-i18n="crawls.col.captured"></th>
              <th class="num" data-i18n-title="crawls.col.linksTitle" data-i18n="crawls.col.links"></th>
              <th class="num">WACZ</th>
              <th class="num" data-i18n="crawls.col.took"></th>
              <th data-i18n="common.col.goto"></th>
            </tr>
          </thead>
          <tbody id="crawls"></tbody>
        </table>
        <p id="crawls-empty" class="empty" hidden data-i18n="crawls.empty"></p>
       </div>
        <!--
          リンクの構成。上から、戻るリンクと題・数の内訳の帯・道具・図（深さを列にした SVG。app.js が組む）・
          選んだページの出入りのリンク。数も「どうなったか」も capture-ledger が残した物（crawl_links）で、
          ここは描くだけ。
        -->
        <div id="links-detail" hidden>
          <p id="links-answer" class="start-answer" hidden></p>
          <div id="links-head"></div>
          <div id="links-split"></div>
          <div id="links-tools" class="links-tools">
            <label><input type="checkbox" id="links-cross" /> <span data-i18n="links.tools.cross"></span></label>
            <button type="button" id="links-fold" data-i18n="links.tools.fold"></button>
          </div>
          <!-- 枠（線）と、横に流す箱 -->
          <div class="links-frame"><div id="links-graph" class="links-graph"></div></div>
          <div id="links-hosts"></div>
          <div id="links-panel" class="links-panel"></div>
        </div>
        <!--
          経緯（#trace/<クロールの id>/<ページの id>・CAPTURE-270）。取り込み 1 回の間に起きたことを、1 本の時間軸に
          並べる。ページの表の結末の欄の「経緯」から開き、一覧と入れ替える（タブは「クロール」のまま）。上から、
          戻るリンクと題・時間軸の帯・節目のスクリーンショット・失敗の時点の絵・要求の並び・選んだ物・注記・ログ。
          中身は全部 app.js が組む（表もここには書かない —— docs の絵の箱が、この画面の表を数えないように）。
        -->
        <div id="trace-detail" hidden>
          <p id="trace-answer" class="start-answer" hidden></p>
          <div id="trace-head"></div>
          <div id="trace-chart"></div>
          <div id="trace-shots"></div>
          <div id="trace-failure"></div>
          <div id="trace-requests"></div>
          <div id="trace-panel"></div>
          <div id="trace-notes"></div>
          <div id="trace-log"></div>
        </div>
      </section>

      <!--
        新しいクロールの画面。左に設定、右にその場の TS。画面は窓の高さに収め、TS の箱がその残りを全部使う
        （巨大な JS を貼って、読んで、少し直して始めるため）。送るのは起点の URL・「このページだけ（maxDepth: 0）」か
        「リンクを辿る」の規則と書いた深さ・枚数・走らせるもの・変数・User-Agent・「乱数を控える」で、書かなかった物は
        capture-ledger の既定（public/start.js の startBody）。走らせるものは、既定のまま（起点で決まる
        既定の顔ぶれを全部選び、その場の TS が空）なら送らない。URL もスクリプトの名前も検査しない（capture-ledger が 400 で言う）。
        本文が上限（/healthz の writeLimit）を超えたら、送る前に止める。答えは左の列の下に 1 行で。
        202 と 409 は一覧の画面へ移り、行に印を付ける。右の列はタブで、その場の TS と読む窓（スクリプトの 1 版か
        受け皿の型を、チェックの横の「読む」で開く）を切り替える。画面は移らず、TS の箱は隠れるだけ。
      -->
      <section id="face-start" hidden>
        <form id="start" class="start" autocomplete="off">
          <div class="start-side">
            <label for="start-seeds" data-i18n="start.seeds.label"></label>
            <textarea id="start-seeds" rows="4" spellcheck="false" placeholder="https://example.com/"></textarea>
            <fieldset class="start-run">
              <legend data-i18n="start.scripts.legend"></legend>
              <!--
                スクリプトの行。app.js がスクリプト集の画面と同じ一覧から描く。外した物は、このクロールでは走らない。
                番号が走る順で、↑↓ で番号の行どうしを入れ替える（チェックでは行は動かない）。読み込みの後に走るその場の TS も、
                書けば行が出て、一緒に動かせる（app.js の drawRunOrder）。
                サイト用のスクリプト（対象サイトのある物）は、起点のどれかが対象サイトのホストにあるときだけ押せる（capture-ledger の決まり）。押せない行は下にまとまる。
                名前の横の「読む」は、その版を右の列で開く（押せないチェックの横でも）
              -->
              <div class="start-row" id="start-picks"></div>
            </fieldset>
            <!--
              クロールごとの値。チェックしたスクリプトが宣言した変数（capture-scripts の catalog.json の params）と、その場の TS が
              defineParams で宣言した変数の欄と、使うシークレットの名前。宣言が 1 つも無ければ出ない（app.js の drawValues）。値は文字列で、workbench は
              検査しない（名前の綴り・64 字・32 個・4,096 字は capture-ledger の決まり。違えば capture-ledger が 400 で言う）。
              シークレットの値は欄に無い —— Windmill の変数 f/waggle_secrets/<名前> に人が置き、クロールのたびに向こうで解かれる。
              名前の横に、WARC に値を残すか（宣言の archive。省けば隠す）が出る
            -->
            <fieldset class="start-run start-values" id="start-values" hidden>
              <legend data-i18n="start.values.legend"></legend>
              <table class="vars" id="start-vars-table" hidden>
                <thead>
                  <tr><th data-i18n="start.values.colName"></th><th data-i18n="start.values.colValue"></th></tr>
                </thead>
                <tbody id="start-vars"></tbody>
              </table>
              <p id="start-secrets" class="start-secrets" hidden></p>
              <p class="start-hint" data-i18n="start.values.hint"></p>
            </fieldset>
            <!--
              クロールごとの User-Agent。空なら送らず、browser の字のまま撮る。workbench は字を検査しない（形は
              capture-ledger の決まりで、違えば capture-ledger が 400 で言う）。{chrome} を解くのは BrowserHive で、解いた字は WACZ の settings.userAgent に残る
            -->
            <fieldset class="start-run" id="start-ua">
              <legend>User-Agent</legend>
              <textarea id="start-ua-text" class="start-ua-text" rows="2" spellcheck="false" data-i18n-placeholder="start.ua.placeholder"></textarea>
              <div class="start-row"><button type="button" id="start-ua-compatible" data-i18n="start.ua.compatible"></button></div>
              <p class="start-hint" data-i18n="start.ua.hint"></p>
            </fieldset>
            <!--
              ページの JS が受け取った乱数（Math.random・crypto）を控えるか（capture-ledger の recordRandom）。外せば送らず、
              capture-ledger の既定（控えない）。入れると BrowserHive がページの JS より先に控えるスクリプトを入れ、値を WACZ の
              random/values.jsonl に残す。撮った時の値を返すのは capture-player（Web Capture）で、ReplayWeb.page は返さない
            -->
            <fieldset class="start-run" id="start-random-box">
              <legend data-i18n="start.random.legend"></legend>
              <label><input type="checkbox" id="start-random" /> <span data-i18n="start.random.label"></span></label>
              <p class="start-hint" data-i18n="start.random.hint"></p>
            </fieldset>
            <div class="start-row">
              <label><input type="radio" name="start-depth" id="start-page" checked /> <span data-i18n="start.depth.pageOnly"></span></label>
              <!-- 辿るときは、右の列の「辿り方」のタブで深さ・枚数・規則を決める -->
              <label><input type="radio" name="start-depth" id="start-follow" /> <span data-i18n="start.depth.follow"></span></label>
            </div>
            <div class="start-row">
              <button type="submit" id="start-go" disabled data-i18n="start.go"></button>
            </div>
            <p id="start-answer" class="start-answer" hidden></p>
            <!--
              いまの欄の中身で予定を作る。本文は「始める」と同じ startBody で、capture-ledger は同じ確かめを通す。撮り方は作ったときに
              固定され、新しい版が出ても変わらない（上げるのは定期実行の画面の「固定し直す」）。
            -->
            <fieldset class="start-run start-schedule">
              <legend data-i18n="start.schedule.make"></legend>
              <div class="start-row">
                <label><span data-i18n="start.schedule.name"></span> <input type="text" id="schedule-name" autocomplete="off" spellcheck="false" data-i18n-placeholder="start.schedule.namePlaceholder" /></label>
                <label><span data-i18n="start.schedule.cron"></span> <input type="text" id="schedule-cron" class="mono" autocomplete="off" spellcheck="false" value="0 4 * * *" /></label>
                <span id="schedule-presets" class="schedule-presets"></span>
              </div>
              <div class="start-row">
                <button type="button" id="schedule-go" disabled data-i18n="start.schedule.make"></button>
              </div>
              <p class="start-hint" data-i18n="start.schedule.hint"></p>
              <p id="schedule-answer" class="start-answer" hidden></p>
            </fieldset>
            <!--
              書き方の注意は左に置く。右の列の高さは、全部 TS の箱に渡す。スクリプトの名前の綴りは capture-ledger の決まりの写し
              （capture-ledger の POST /api/crawls・inline.name）で、workbench は検査しない（違えば capture-ledger が 400 で言う）
            -->
            <p class="start-hint">
              <span data-i18n="start.inline.hint"></span>
              <!-- data-read: ふつうに押せば右の列で開く（app.js）。修飾キーならスクリプト集の画面を別のタブで -->
              <a href="#scripts/types/host.d.ts" data-read data-i18n="start.inline.readTypes"></a>
            </p>
          </div>
          <div class="start-code">
            <!-- 右の列のタブ。読む窓のタブと × は、スクリプトの「読む」で開いている間だけ出る（app.js の showStartTab） -->
            <div class="start-tabs">
              <button type="button" id="start-tab-js" class="on" data-i18n="start.tab.inline"></button>
              <button type="button" id="start-tab-rules" hidden data-i18n="start.tab.rules"></button>
              <button type="button" id="start-tab-read" hidden></button>
              <button type="button" id="start-tab-close" data-i18n-aria-label="start.tab.closeRead" hidden>×</button>
            </div>
            <div id="start-js" class="start-js">
              <div class="start-row">
                <label for="start-inline-name" data-i18n="start.inline.name"></label>
                <span class="start-name"
                  ><span class="prefix">inline-</span
                  ><input type="text" id="start-inline-name" spellcheck="false" placeholder="close-banner"
                /></span>
                <label><input type="radio" name="start-phase" id="start-inline-behavior" checked /> <span data-i18n="start.inline.afterLoad"></span></label>
                <label><input type="radio" name="start-phase" id="start-inline-preload" /> <span data-i18n="start.inline.beforeNavigation"></span></label>
                <label class="start-file"
                  ><span data-i18n="start.inline.file"></span><input type="file" id="start-inline-file" accept=".ts,.js,.mjs,text/plain,text/javascript"
                /></label>
                <!-- 1 行目の // @ts-nocheck を足し引きする。見えている物が送る物 -->
                <label><input type="checkbox" id="start-nocheck" /> <span data-i18n="start.inline.nocheck"></span></label>
              </div>
              <!-- 行番号の溝と箱。折り返さない（折り返すと溝の番号と行がずれる） -->
              <div class="start-editor">
                <pre id="start-gutter" class="gutter" aria-hidden="true">1</pre>
                <textarea
                  id="start-inline-source"
                  wrap="off"
                  spellcheck="false"
                  data-i18n-aria-label="start.tab.inline"
                  placeholder="(() => {&#10;  document.querySelector&lt;HTMLButtonElement&gt;(&quot;#accept&quot;)?.click();&#10;})();"
                ></textarea>
              </div>
              <p id="start-size" class="start-size" data-i18n="start.size.empty"></p>
              <!-- 欄が出ない理由（宣言を読めない・確かめられない）。無ければ出ない（start.js の inlineDeclared） -->
              <p id="start-inline-note" class="start-size bad" hidden></p>
            </div>
            <!--
              辿り方。「リンクを辿る」のときだけタブが出る。規則は上から当て、最初に当たった行が決める（capture-ledger の決まり）。
              行を変えて 300 ms 止まると、capture-ledger の確かめのエンドポイント（GET /api/crawl-rules/check）を引き、行ごとの印と最後の
              1 行（何を辿るかの言い直し）を描き直す。capture-ledger が「始められない」と言っている間は「始める」を押せない
            -->
            <div id="start-rules" class="start-rules" hidden>
              <div class="start-row">
                <label for="start-max-depth" data-i18n="start.rules.depth"></label>
                <input type="number" id="start-max-depth" min="1" max="10" data-i18n-placeholder="start.rules.default" />
                <span class="muted" data-i18n="start.rules.depthUnit"></span>
                <label for="start-max-pages" data-i18n="start.rules.pages"></label>
                <input type="number" id="start-max-pages" min="1" max="10000" data-i18n-placeholder="start.rules.default" />
                <span class="muted" data-i18n="start.rules.pagesUnit"></span>
              </div>
              <div class="start-row" id="start-presets">
                <span class="muted" data-i18n="start.rules.presets"></span>
                <button type="button" data-preset="site" data-i18n="start.rules.preset.site"></button>
                <button type="button" data-preset="siteAndOneHop" data-i18n="start.rules.preset.siteAndOneHop"></button>
                <button type="button" data-preset="host" data-i18n="start.rules.preset.host"></button>
                <button type="button" data-preset="any" data-i18n="start.rules.preset.any"></button>
              </div>
              <table class="rules">
                <thead>
                  <tr><th data-i18n="start.rules.colRow"></th><th data-i18n="start.rules.colAction"></th><th data-i18n="start.rules.colMatch"></th><th data-i18n="start.rules.colAnswer"></th><th></th></tr>
                </thead>
                <tbody id="start-rule-rows"></tbody>
              </table>
              <div class="start-row">
                <button type="button" id="start-add-skip" data-i18n="start.rules.addSkip"></button>
                <button type="button" id="start-add-row" data-i18n="start.rules.addRow"></button>
              </div>
              <p id="start-said" class="start-said" aria-live="polite"></p>
            </div>
            <!--
              読む窓。スクリプトの 1 版か受け皿の型を、スクリプト集の画面と同じ部品で出す（app.js の IN_START）。版のリンクと
              行の URL は持たない —— 要るなら「スクリプト集の画面で開く」。source は他人が書いたもの。文字は textContent で
            -->
            <div id="start-read" class="start-read" hidden>
              <div id="start-read-head" class="vhead rhead"></div>
              <p id="start-read-note" class="reading-note" hidden></p>
              <p id="start-read-colors" class="reading-colors" hidden></p>
              <div id="start-read-ask" class="reading-ask" hidden></div>
              <ol id="start-read-lines" class="vlines rlines" tabindex="0" data-i18n-aria-label="start.read.source"></ol>
            </div>
          </div>
        </form>
      </section>

      <section id="face-archives" hidden>
        <table>
          <thead>
            <tr>
              <th data-i18n="archives.col.look"></th>
              <th data-i18n="archives.col.source"></th>
              <th data-i18n="archives.col.label"></th>
              <th data-i18n="archives.col.capturedAt"></th>
              <th data-i18n="archives.col.complete"></th>
              <th data-i18n="archives.col.conformant"></th>
              <th></th>
              <th>WACZ</th>
              <th data-i18n="common.col.goto"></th>
            </tr>
          </thead>
          <tbody id="archives"></tbody>
        </table>
        <p id="archives-empty" class="empty" hidden data-i18n="archives.empty"></p>
      </section>

      <!--
        検索の画面。capture-ledger の全文検索（GET /api/search）を、打った語で引く。引くのは「探す」を押したときと、URL
        （#search/<語>）で開いたときだけ —— ほかの画面の引き直しの周回には入れない（検索の答えない capture-ledger で、周回ごと
        落とさないため）。当たりはアーカイブの 1 時点（写しの行がある WACZ は写しの時点、写しの無い取り込みは文書）で、
        見せてよいアーカイブの物だけが返る。撮った中身は他人が書いたもの —— 題・文字・当たった所は textContent で。
      -->
      <!--
        定期実行（CAPTURE-174）。予定は capture-ledger の資源で、周回は capture-ledger の中で回る。ここは状態を読んで操作を頼むだけ。
      -->
      <section id="face-schedules" hidden>
        <p id="schedules-answer" class="start-answer" hidden></p>
        <p id="schedules-empty" class="empty" hidden data-i18n="schedules.empty"></p>
        <div id="schedules"></div>
      </section>

      <!--
        前回からの変化（CAPTURE-167）。予定の回を前の回と比べた結果。一覧は回のまとめ、開くとページごとの差分と要約。
        **要約は証拠ではない** —— 差分は capture-ledger が 2 本の WACZ から Claude なしで作った物で、要約はそれを読みやすくしただけ。
      -->
      <section id="face-changes" hidden>
        <p id="changes-answer" class="start-answer" hidden></p>
        <!-- 一覧（#changes）。回を開くと隠す -->
        <div id="changes-list">
          <p id="changes-empty" class="empty" hidden data-i18n="changes.empty"></p>
          <table id="changes-table" hidden>
            <thead>
              <tr>
                <th data-i18n="changes.col.schedule"></th>
                <th data-i18n="changes.col.started"></th>
                <th data-i18n="changes.col.change"></th>
                <th class="wide" data-i18n="changes.col.claude"></th>
              </tr>
            </thead>
            <tbody id="changes-rows"></tbody>
          </table>
        </div>
        <!-- 回 1 本（#changes/<回>/<今回の WACZ の id>）。左に回の全ページの目次、右に選んだ 1 ページ（CAPTURE-236） -->
        <div id="change-detail" hidden>
          <div id="change-head"></div>
          <div id="change-body" class="change-body">
            <nav id="change-toc" class="change-toc" data-i18n-aria-label="changes.toc.label"></nav>
            <section id="change-pane" class="change-pane"></section>
          </div>
        </div>
      </section>

      <section id="face-search" hidden>
        <form id="search" class="search" autocomplete="off">
          <label for="search-words" data-i18n="search.words"></label>
          <input type="search" id="search-words" spellcheck="false" data-i18n-placeholder="search.placeholder" />
          <button type="submit" id="search-go" data-i18n="search.go"></button>
        </form>
        <p id="search-answer" class="search-answer" hidden></p>
        <table id="search-table" hidden>
          <thead>
            <tr>
              <th data-i18n="search.col.stage"></th>
              <th data-i18n="search.col.hit"></th>
              <th data-i18n="common.col.goto"></th>
            </tr>
          </thead>
          <tbody id="search-hits"></tbody>
        </table>
      </section>

      <!--
        スクリプト集の画面（読む所）。左に一覧（スクリプトと受け皿の型）、右に JS にする前の source。本文は
        1 行 1 つの <li>（WACZ の画面の行の並びと同じ組み方）で、押した行が URL になる
        （#scripts/<id>[@版][:行]・履歴は増やさない）。版のリンクは見出しに、開いた id の分だけ。
        source は他人が書いたもの —— 文字は textContent で。色は worker（Shiki）が付け、1 色で描いた
        同じ <li> に後から塗る。塗れないときは #reading-colors に 1 行（本文は 1 色のまま読める）。
      -->
      <section id="face-scripts" hidden>
        <!--
          空は「異常ではないが、たいてい間違い」。BrowserHive は顔ぶれを持たないので、
          登録済みのスクリプトが無いと、ページの中で何も走らない —— それでも取り込みは成功する。
        -->
        <p id="scripts-empty" class="empty bad" hidden data-i18n="scripts.empty"></p>
        <div class="vgrid">
          <nav id="reading-list" class="rlist" data-i18n-aria-label="common.tab.scripts"></nav>
          <div class="vmain">
            <div id="reading-head" class="vhead rhead"></div>
            <p id="reading-note" class="reading-note" hidden></p>
            <p id="reading-colors" class="reading-colors" hidden></p>
            <div id="reading-ask" class="reading-ask" hidden></div>
            <ol id="reading-lines" class="vlines rlines"></ol>
          </div>
        </div>
      </section>

      <!--
        WACZ 1 本の中身。左に木（検証の報告の entries から。wacz-validator の tui と同じ入力・同じ罫線）、
        右に選んだ entry の詳細と中身（行の窓・1 行・warcinfo の枠とレコードの一覧・1 レコード）。
        撮った中身は他人が書いたもの —— 文字は textContent、画像は raster だけを <img> で。
      -->
      <section id="face-wacz" hidden>
        <div id="wacz-bar" class="vbar"></div>
        <div class="vgrid vgrid-tree">
          <pre id="wacz-tree" class="vtree"></pre>
          <div class="vmain">
            <div id="wacz-head" class="vhead"></div>
            <div id="wacz-content"></div>
          </div>
        </div>
      </section>
    </main>

    <footer id="pulse" data-i18n="common.loading"></footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
